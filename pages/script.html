    <script>
        (() => {
            if (!customElements.get('ci-icon')) {
                class CreativeIcon extends HTMLElement {
                    connectedCallback() {
                        if (this.dataset.ready === '1') return;
                        const name = this.getAttribute('name') || 'info';
                        this.dataset.ready = '1';
                        this.innerHTML = `<svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="#ci-i-${name}"></use></svg>`;
                    }
                }
                customElements.define('ci-icon', CreativeIcon);
            }
            window.setIconText = (element, iconName, text, extraClass = '') => {
                if (!element) return;
                element.replaceChildren();
                const icon = document.createElement('ci-icon');
                icon.setAttribute('name', iconName);
                if (extraClass) icon.className = extraClass;
                element.append(icon, document.createTextNode(text == null || text === '' ? '' : ` ${String(text)}`));
            };
        })();
    </script>

    <script>
        (() => {
            const icon = (name) => {
                const icons = {
                    check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>',
                    x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
                    info: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></svg>',
                    warning: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.7 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>',
                    trash: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 10v7M14 10v7"/></svg>',
                    restore: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>'
                };
                return icons[name] || icons.info;
            };
            const stack = document.getElementById('appToastStack');
            const showToastLayer = () => {
                if (!stack) return;
                try {
                    if (typeof stack.showPopover === 'function' && !stack.matches(':popover-open')) {
                        stack.showPopover();
                    }
                } catch (_) {}
            };
            const hideToastLayerIfEmpty = () => {
                if (!stack || stack.children.length) return;
                try {
                    if (typeof stack.hidePopover === 'function' && stack.matches(':popover-open')) {
                        stack.hidePopover();
                    }
                } catch (_) {}
            };
            const bringToastLayerToFront = () => {
                if (!stack || !stack.children.length) return;
                try {
                    if (typeof stack.showPopover !== 'function') return;
                    if (stack.matches(':popover-open')) stack.hidePopover();
                    stack.showPopover();
                } catch (_) {}
            };
            window.appToast = (message, type = 'info', duration = null) => {
                if (!stack || !message) return null;
                const kind = ['success','error','danger','warning','info'].includes(type) ? type : 'info';
                const toast = document.createElement('div');
                toast.className = `app-toast ${kind}`;
                toast.setAttribute('role', kind === 'error' || kind === 'danger' ? 'alert' : 'status');
                const iconWrap = document.createElement('span');
                iconWrap.className = 'app-toast-icon';
                iconWrap.innerHTML = icon(
                    kind === 'success' ? 'check' :
                    (kind === 'warning' || kind === 'error' || kind === 'danger' ? 'warning' : 'info')
                );
                const msg = document.createElement('span');
                msg.className = 'app-toast-message';
                msg.textContent = String(message);
                const close = document.createElement('button');
                close.type = 'button';
                close.className = 'app-toast-close';
                close.setAttribute('aria-label','Tutup notifikasi');
                close.innerHTML = icon('x');
                toast.append(iconWrap, msg, close);
                stack.appendChild(toast);
                while (stack.children.length > 3) stack.firstElementChild?.remove();
                showToastLayer();
                let removed = false;
                const remove = () => {
                    if (removed || !toast.isConnected) return;
                    removed = true;
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-8px)';
                    setTimeout(() => {
                        toast.remove();
                        hideToastLayerIfEmpty();
                    }, 220);
                };
                close.addEventListener('click', remove);
                const manual = duration !== null && duration !== undefined && Number.isFinite(Number(duration));
                const textValue = String(message).trim();
                const words = textValue ? textValue.split(/\s+/).length : 0;
                const readingMs = 1900 + words * 185 + Math.max(0, textValue.length - 80) * 12 +
                    ((kind === 'error' || kind === 'danger') ? 900 : (kind === 'warning' ? 450 : 0));
                const ms = manual
                    ? Math.max(1800, Math.min(9000, Number(duration)))
                    : Math.max(2400, Math.min(7800, readingMs));
                setTimeout(remove, ms);
                return toast;
            };
            const layer = document.getElementById('appDialogUi');
            const title = document.getElementById('appDialogUiTitle');
            const message = document.getElementById('appDialogUiMessage');
            const iconWrap = document.getElementById('appDialogUiIcon');
            const cancel = document.getElementById('appDialogUiCancel');
            const confirmBtn = document.getElementById('appDialogUiConfirm');
            let resolver = null;
            let dismissOnBackdrop = true;
            let previousFocus = null;
            const finish = (value) => {
                if (!resolver) return;
                const done = resolver;
                resolver = null;
                layer.classList.remove('open');
                layer.setAttribute('aria-hidden','true');
                document.removeEventListener('keydown', onKeydown, true);
                setTimeout(() => previousFocus?.focus?.(), 0);
                done(Boolean(value));
            };
            const onKeydown = (event) => {
                if (event.key === 'Escape') {
                    event.preventDefault();
                    if (cancel.style.display !== 'none') finish(false);
                }
            };
            const open = (opts = {}) => {
                if (!layer) return Promise.resolve(false);
                if (resolver) finish(false);
                previousFocus = document.activeElement;
                title.textContent = opts.title || 'Konfirmasi';
                message.textContent = opts.message || '';
                cancel.textContent = opts.cancelText || 'Batal';
                confirmBtn.textContent = opts.confirmText || 'Oke';
                cancel.style.display = opts.showCancel === false ? 'none' : '';
                const tone = opts.tone || 'info';
                iconWrap.className = `app-dialog-icon-ui ${tone === 'danger' ? 'danger' : (tone === 'warning' ? 'warning' : '')}`;
                iconWrap.innerHTML = icon(opts.icon || (tone === 'danger' ? 'trash' : (tone === 'warning' ? 'warning' : 'info')));
                confirmBtn.className = `app-dialog-btn-ui app-dialog-confirm-ui ${tone === 'danger' ? 'danger' : ''}`;
                dismissOnBackdrop = opts.dismissOnBackdrop !== false;
                layer.classList.add('open');
                layer.setAttribute('aria-hidden','false');
                document.addEventListener('keydown', onKeydown, true);
                bringToastLayerToFront();
                setTimeout(() => (opts.showCancel === false ? confirmBtn : cancel).focus(), 0);
                return new Promise(resolve => { resolver = resolve; });
            };
            cancel?.addEventListener('click', () => finish(false));
            confirmBtn?.addEventListener('click', () => finish(true));
            layer?.addEventListener('click', (event) => {
                if (event.target === layer && dismissOnBackdrop && cancel.style.display !== 'none') finish(false);
            });
            window.appAlert = (message, options = {}) => open({
                title: options.title || (options.tone === 'danger' ? 'Terjadi Kesalahan' : 'Informasi'),
                message: String(message ?? ''),
                showCancel: false,
                confirmText: options.confirmText || 'Mengerti',
                tone: options.tone || 'info',
                icon: options.icon || (options.tone === 'danger' ? 'warning' : 'info'),
                dismissOnBackdrop: false
            });
            window.appConfirm = (message, options = {}) => open({
                title: options.title || 'Konfirmasi',
                message: String(message ?? ''),
                showCancel: true,
                cancelText: options.cancelText || 'Batal',
                confirmText: options.confirmText || 'Lanjutkan',
                tone: options.tone || 'danger',
                icon: options.icon || 'trash',
                dismissOnBackdrop: true
            });
        })();
    </script>

            <button class="btn-close-sp" onclick="closeFilterDrawer()" title="Tutup Panel">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="side-panel-body">
            <div class="input-group" style="margin-bottom: 24px;">
                <label>Urutkan Berdasarkan</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <button class="btn-sp-action" id="sort-newest" onclick="setSort('newest')"><ci-icon name=sparkles></ci-icon> Terakhir Diedit</button>
                    <button class="btn-sp-action" id="sort-oldest" onclick="setSort('oldest')"><ci-icon name=hourglass></ci-icon> Edit Terlama</button>
                </div>
            </div>
            <div class="input-group" style="margin-bottom: 24px;">
                <label>Status Naskah</label>
                <div class="status-grid-2col">
                    <button class="filter-list-btn" id="status-all" onclick="setStatusFilter('all')">
                        <span class="member-name">Semua</span><span class="filter-badge" id="count-all">0</span>
                    </button>
                    <button class="filter-list-btn" id="status-pinned" onclick="setStatusFilter('pinned')">
                        <span class="member-name"><ci-icon name=pin></ci-icon> Pinned</span><span class="filter-badge" id="count-pinned">0</span>
                    </button>
                    <button class="filter-list-btn" id="status-draft" onclick="setStatusFilter('draft')">
                        <span class="member-name"><ci-icon name=file-pen></ci-icon> Draft</span><span class="filter-badge" id="count-draft">0</span>
                    </button>
                    <button class="filter-list-btn" id="status-done" onclick="setStatusFilter('done')">
                        <span class="member-name"><ci-icon name=check-circle></ci-icon> Selesai</span><span class="filter-badge" id="count-done">0</span>
                    </button>
                    <button class="filter-list-btn" id="status-restored" onclick="setStatusFilter('restored')" style="grid-column: 1 / -1;">
                        <span class="member-name"><ci-icon name=restore></ci-icon> Dipulihkan</span><span class="filter-badge" id="count-restored">0</span>
                    </button>
                </div>
            </div>
            <div class="input-group">
                <div class="category-section-head">
                    <label>Berdasarkan Kategori</label>
                    <button type="button" class="category-manage-toggle" id="categoryManageToggle" onclick="toggleCategoryManager()">Kelola</button>
                </div>
                <div class="category-manage-hint" id="categoryManageHint" hidden>
                    Ubah nama kategori yang sudah digunakan. Jumlah naskah menunjukkan berapa dokumen yang akan ikut diperbarui.
                </div>
                <div class="category-grid-flex" id="drawerCategoryContainer"></div>
            </div>
        </div>
        <div class="side-panel-footer">
            <button class="btn-modal btn-cancel" onclick="resetFilters()" style="width: 100%; border-radius: 12px; font-weight: 800;">
                <ci-icon name=x></ci-icon> Bersihkan Semua Filter
            </button>
        </div>
    </div>
</div>
</body>
</html>
