    <div id="navbar-container"></div>
    <div class="bg-glow one"></div><div class="bg-glow two"></div>
    <div class="wrapper">
        <div class="page-header">
            <div class="header-title">
                <h1><svg class="ui-icon" aria-hidden="true"><use href="#ui-i-trash"></use></svg> Tempat Sampah</h1>
                <p>Item di sini akan otomatis dihancurkan secara permanen setelah 30 hari.</p>
            </div>
            <button class="btn-empty-trash" onclick="emptyTrash()">Kosongkan Sampah</button>
        </div>
        <div class="filter-wrap">
            <button class="filter-btn active" onclick="setFilter('all', this)">
                Semua <span class="badge-count" id="countAll">0</span>
            </button>
            <button class="filter-btn" onclick="setFilter('script', this)">
                <svg class="ui-icon" aria-hidden="true"><use href="#ui-i-file-text"></use></svg> Script <span class="badge-count" id="countScript">0</span>
            </button>
            <button class="filter-btn" onclick="setFilter('notes', this)">
                <svg class="ui-icon" aria-hidden="true"><use href="#ui-i-notebook"></use></svg> Notes <span class="badge-count" id="countNotes">0</span>
            </button>
            <button class="filter-btn" onclick="setFilter('planner', this)">
                <svg class="ui-icon" aria-hidden="true"><use href="#ui-i-lightbulb"></use></svg> Ideas <span class="badge-count" id="countIdeas">0</span>
            </button>
        </div>
        <div class="trash-list" id="trashList">
            <div style="grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 30vh; color: var(--text-muted); width: 100%;">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
                <div style="font-weight: 700; font-size: 14px; margin-top: 12px;">Memeriksa riwayat sampah...</div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="progressModal">
        <div class="modal-card">
            <div style="display: flex; justify-content: center; margin-bottom: 20px;">
                <svg id="progressSpinner" xmlns="http://www.w3.org/2000/svg" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
                <div id="progressSuccess" style="display: none;"><svg class="ui-icon" aria-hidden="true"><use href="#ui-i-check-circle"></use></svg></div>
            </div>
            <h3 id="progressTitle">Mengosongkan Sampah</h3>
            <p id="progressText">Menyiapkan proses...</p>
        </div>
    </div>
    <div class="app-toast-stack" id="appToastStack" popover="manual" aria-live="polite" aria-atomic="false"></div>
    <div class="app-dialog-ui" id="appDialogUi" role="dialog" aria-modal="true" aria-labelledby="appDialogUiTitle" aria-describedby="appDialogUiMessage" aria-hidden="true">
        <div class="app-dialog-card-ui" role="document">
            <div class="app-dialog-icon-ui" id="appDialogUiIcon"></div>
            <h2 id="appDialogUiTitle"></h2>
            <p id="appDialogUiMessage"></p>
            <div class="app-dialog-actions-ui">
                <button type="button" class="app-dialog-btn-ui" id="appDialogUiCancel">Batal</button>
                <button type="button" class="app-dialog-btn-ui app-dialog-confirm-ui" id="appDialogUiConfirm">Oke</button>
            </div>
        </div>
    </div>
    <script>
        (() => {
            const icon = (name) => {
                const icons = {
                    check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>',
                    x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
                    info: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></svg>',
                    warning: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.7 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>',
                    trash: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7M14 10v7" stroke-width="1.8"/></svg>',
                    restore: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>'
                };
                return icons[name] || icons.info;
            };
            const stack = document.getElementById('appToastStack');
            const showToastLayer = () => {
                if (!stack) return;
                try {
                    if (typeof stack.showPopover === 'function' && !stack.matches(':popover-open')) {
                        stack.showPopover();
                    }
                } catch (_) {}
